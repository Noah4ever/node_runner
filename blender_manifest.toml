schema_version = "1.0.0"

id = "node_runner"
version = "1.5.0"
name = "Node Runner"
tagline = "Import and export nodes as strings"
maintainer = "Tonis"

type = "add-on"

tags = ["Node", "Material", "Geometry Nodes"]

blender_version_min = "4.5.0"

# https://docs.blender.org/manual/en/dev/advanced/extensions/licenses.html
license = ["SPDX:GPL-3.0-or-later"]

[build]
paths = [
  "__init__.py",
  "operators.py",
  "preferences.py",
  "modifiers.py",
  "constants.py",
  "encoding.py",
  "node_data.py",
  "serialize.py",
  "deserialize.py",
  "library.py",
  "net.py",
  "library_ui.py",
  "LICENSE",
]

[permissions]
clipboard = "Copy Node Runner Hash to clipboard"
network = "Download node setups from the library repositories you configure"
files = "Cache downloaded node setups and publish setups to a folder you pick"
